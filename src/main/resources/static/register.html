<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f7f3"><title>Create account — figo.li</title><link rel="stylesheet" href="/styles.css"></head>
<body class="auth-page"><header class="site-header"><a class="wordmark" href="/">figo<span>.</span>li</a><span class="header-note">Your little corner of the web</span></header><main class="auth-shell"><a class="back-link" href="/">← figo.li home</a><div class="auth-card"><div class="auth-icon">✳</div><div class="eyebrow">MAKE YOURSELF AT HOME</div><h1>A good place<br><em>to start.</em></h1><p class="auth-copy">Create an account. An admin will approve it before you can sign in.</p><div id="auth-notice" class="auth-notice" hidden></div><form id="register-form"><label>Email address<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254"></label><label>Password<input name="password" type="password" autocomplete="new-password" placeholder="At least 12 characters" required minlength="12"><small>Use at least 12 characters. Pick one you don’t use elsewhere.</small></label><label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" placeholder="Type it again" required minlength="12"></label><button class="button button-dark auth-submit" type="submit">Request an account <span>→</span></button></form><div class="auth-foot">Already have an account? <a href="/login">Sign in</a></div></div><div class="auth-note">Made with care at home.</div></main><script src="/auth.js" defer></script></body></html>
